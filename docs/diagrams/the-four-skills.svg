<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="330" viewBox="0 0 1390 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546a"/>
    </marker>
  </defs>
  <rect width="1390" height="330" fill="#ffffff"/>

  <!-- session log -->
  <rect x="430" y="20" width="240" height="44" rx="8" fill="#f5f7fa" stroke="#44546a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="550" y="47" text-anchor="middle" font-size="15" fill="#1f2937">session log</text>

  <!-- main row -->
  <rect x="20" y="130" width="140" height="56" rx="8" fill="#f5f7fa" stroke="#44546a" stroke-width="1.5"/>
  <text x="90" y="163" text-anchor="middle" font-size="15" fill="#1f2937">your request</text>

  <rect x="250" y="130" width="140" height="56" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="320" y="163" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" fill="#1f2937">file-issue</text>

  <rect x="480" y="130" width="140" height="56" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="550" y="163" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" fill="#1f2937">do-task</text>

  <rect x="710" y="130" width="140" height="56" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="780" y="163" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" fill="#1f2937">open-pr</text>

  <rect x="940" y="130" width="140" height="56" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="1010" y="163" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" fill="#1f2937">land-pr</text>

  <rect x="1170" y="122" width="200" height="72" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="1270" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">merged</text>
  <text x="1270" y="174" text-anchor="middle" font-size="12" fill="#374151">issue closed, branch deleted</text>

  <!-- main arrows -->
  <line x1="160" y1="158" x2="248" y2="158" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="390" y1="158" x2="478" y2="158" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="434" y="150" text-anchor="middle" font-size="12" fill="#374151">issue</text>
  <line x1="620" y1="158" x2="708" y2="158" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="664" y="150" text-anchor="middle" font-size="12" fill="#374151">work</text>
  <line x1="850" y1="158" x2="938" y2="158" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="894" y="150" text-anchor="middle" font-size="12" fill="#374151">passes</text>
  <text x="894" y="176" text-anchor="middle" font-size="12" fill="#374151">opens PR</text>
  <line x1="1080" y1="158" x2="1168" y2="158" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1124" y="150" text-anchor="middle" font-size="12" fill="#374151">your yes</text>

  <!-- session log arrows -->
  <line x1="340" y1="130" x2="452" y2="66" stroke="#44546a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="372" y="92" text-anchor="middle" font-size="12" fill="#374151">links</text>
  <line x1="550" y1="64" x2="550" y2="128" stroke="#44546a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="560" y="100" font-size="12" fill="#374151">reads</text>
  <line x1="648" y1="64" x2="760" y2="128" stroke="#44546a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="726" y="92" font-size="12" fill="#374151">checks the request</text>

  <!-- branches -->
  <rect x="710" y="252" width="140" height="48" rx="8" fill="#fdecea" stroke="#c5221f" stroke-width="1.5"/>
  <text x="780" y="281" text-anchor="middle" font-size="14" fill="#1f2937">report, stop</text>
  <line x1="780" y1="186" x2="780" y2="250" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="790" y="222" font-size="12" fill="#374151">fails</text>

  <rect x="940" y="252" width="140" height="48" rx="8" fill="#fdecea" stroke="#c5221f" stroke-width="1.5"/>
  <text x="1010" y="281" text-anchor="middle" font-size="14" fill="#1f2937">not merged</text>
  <line x1="1010" y1="186" x2="1010" y2="250" stroke="#44546a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1020" y="222" font-size="12" fill="#374151">no yes</text>
</svg>
