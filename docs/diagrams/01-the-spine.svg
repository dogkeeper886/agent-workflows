<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2328">One piece of work, from a remark to merged</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#656d76">The issue is the portal. Every step resolves back to it, so nobody carries context forward by hand.</text>

  <g stroke="#57606a" stroke-width="1.5" fill="#f6f8fa">
    <rect x="30"  y="86" width="180" height="48" rx="6"/>
    <rect x="270" y="86" width="180" height="48" rx="6"/>
    <rect x="510" y="86" width="180" height="48" rx="6"/>
    <rect x="750" y="86" width="180" height="48" rx="6"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#1f2328">
    <text x="120" y="115">file-issue</text>
    <text x="360" y="115">do-task</text>
    <text x="600" y="115">open-pr</text>
    <text x="840" y="115">land-pr</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" marker-end="url(#a)">
    <line x1="210" y1="110" x2="268" y2="110"/>
    <line x1="450" y1="110" x2="508" y2="110"/>
    <line x1="690" y1="110" x2="748" y2="110"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#656d76">
    <text x="120" y="154">an SCQA-framework intro, and the</text>
    <text x="120" y="170">session log in .sessions/</text>
    <text x="360" y="154">reads the issue and its log,</text>
    <text x="360" y="170">then does the work</text>
    <text x="600" y="154">reviews the work against</text>
    <text x="600" y="170">what the issue asked</text>
    <text x="840" y="154">merges on your yes, pinned</text>
    <text x="840" y="170">to the head you reviewed</text>
  </g>

  <line x1="600" y1="180" x2="600" y2="206" stroke="#9a6700" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="470" y="210" width="260" height="40" rx="6" fill="#fff8e5" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="600" y="235" text-anchor="middle" font-size="13" fill="#7a4f01">a failed review stops and reports</text>

  <text x="480" y="284" text-anchor="middle" font-size="13" fill="#656d76">State lives on the platform: the issue, the branch, the pull request. The toolkit keeps none of its own.</text>
  <text x="480" y="308" text-anchor="middle" font-size="13" fill="#656d76">Every step stops for a person. Nothing auto-runs the next.</text>
</svg>
